services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env.example
    volumes:
      - ./apps/api/data:/app/data
    ports:
      - '8080:8080'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - PUBLIC_API_BASE_URL=http://localhost:8080
    ports:
      - '5173:5173'
    depends_on:
      - api
